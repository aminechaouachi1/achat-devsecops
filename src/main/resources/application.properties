server.port=8089
server.servlet.context-path=/SpringMVC

# Aucun secret en clair : valeurs injectees par variables d environnement
# (docker-compose, lui-meme alimente par les credentials Jenkins)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/achatdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Ne pas divulguer de details techniques dans les erreurs (constat classique ZAP)
server.error.include-stacktrace=never
server.error.include-message=never

# Actuator : sante + metriques Prometheus uniquement
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
